<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Family Book Library</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;
        
        // ⚠️ REPLACE THESE WITH YOUR FIREBASE CONFIG
        // Get these from: Firebase Console > Project Settings > Web App
        const firebaseConfig = {
            apiKey: "AIzaSyBUFTp6iV-X12Hqm16hbyVivXEvsCt69o4",
            authDomain: "book-library-75aa0.firebaseapp.com",
            projectId: "book-library-75aa0",
            storageBucket: "book-library-75aa0.firebasestorage.app",
            messagingSenderId: "336574387184",
            appId: "1:336574387184:web:9b800c24cac482771b8335"
        };

        // Initialize Firebase
        let db = null;
        try {
            const app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);
        } catch (error) {
            console.log('Firebase config needed. See setup instructions.');
        }

        function BookTracker() {
            const [books, setBooks] = useState([]);
            const [title, setTitle] = useState('');
            const [author, setAuthor] = useState('');
            const [filterAuthor, setFilterAuthor] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [readers, setReaders] = useState([]);
            const [isWishlistItem, setIsWishlistItem] = useState(false);
            const [shelf, setShelf] = useState('library');
            const [viewMode, setViewMode] = useState('author');
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('connecting');
            const FAMILY_MEMBERS = ['Whitney', 'Braden', 'Lorelai'];

            // Load books from Firebase on mount
            useEffect(() => {
                if (!db) {
                    setLoading(false);
                    setSyncStatus('error');
                    return;
                }

                const unsubscribe = db.collection('books').onSnapshot(
                    (snapshot) => {
                        const booksData = [];
                        snapshot.forEach((doc) => {
                            booksData.push({ id: doc.id, ...doc.data() });
                        });
                        setBooks(booksData);
                        setLoading(false);
                        setSyncStatus('synced');
                    },
                    (error) => {
                        console.error('Firebase error:', error);
                        setSyncStatus('error');
                        setLoading(false);
                    }
                );

                return unsubscribe;
            }, []);

            useEffect(() => {
                if (title.length < 2) {
                    setSuggestions([]);
                    return;
                }

                const timer = setTimeout(async () => {
                    try {
                        const response = await fetch(
                            `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(title)}&maxResults=8`
                        );
                        const data = await response.json();

                        const uniqueSuggestions = [];
                        const seen = new Set();

                        (data.items || []).forEach(item => {
                            const bookTitle = item.volumeInfo?.title;
                            const bookAuthor = item.volumeInfo?.authors?.[0];
                            if (bookTitle && bookAuthor) {
                                const key = `${bookTitle}|${bookAuthor}`;
                                if (!seen.has(key)) {
                                    seen.add(key);
                                    uniqueSuggestions.push({ title: bookTitle, author: bookAuthor });
                                }
                            }
                        });

                        setSuggestions(uniqueSuggestions.slice(0, 8));
                    } catch (error) {
                        console.error('Error fetching book suggestions:', error);
                        setSuggestions([]);
                    }
                }, 350);

                return () => clearTimeout(timer);
            }, [title]);

            const selectSuggestion = (suggestion) => {
                setTitle(suggestion.title);
                setAuthor(suggestion.author);
                setSuggestions([]);
                setShowSuggestions(false);
            };

            const addBook = async () => {
                if (title.trim() && author.trim() && db) {
                    try {
                        await db.collection('books').add({
                            title: title.trim(),
                            author: author.trim(),
                            addedDate: new Date().toLocaleDateString(),
                            readers: readers,
                            status: isWishlistItem ? 'wishlist' : 'owned',
                            createdAt: new Date()
                        });
                        setTitle('');
                        setAuthor('');
                        setReaders([]);
                        setIsWishlistItem(false);
                        setSuggestions([]);
                    } catch (error) {
                        console.error('Error adding book:', error);
                    }
                }
            };

            const moveToLibrary = async (bookId) => {
                if (db) {
                    try {
                        await db.collection('books').doc(bookId).update({
                            status: 'owned'
                        });
                    } catch (error) {
                        console.error('Error moving book to library:', error);
                    }
                }
            };

            const toggleReader = (reader) => {
                if (readers.includes(reader)) {
                    setReaders(readers.filter(r => r !== reader));
                } else {
                    setReaders([...readers, reader]);
                }
            };

            const updateBookReaders = async (bookId, newReaders) => {
                if (db) {
                    try {
                        await db.collection('books').doc(bookId).update({
                            readers: newReaders
                        });
                    } catch (error) {
                        console.error('Error updating readers:', error);
                    }
                }
            };

            const deleteBook = async (id) => {
                if (db) {
                    try {
                        await db.collection('books').doc(id).delete();
                    } catch (error) {
                        console.error('Error deleting book:', error);
                    }
                }
            };

            const uniqueAuthors = [...new Set(books.filter(b => (b.status || 'owned') === (shelf === 'library' ? 'owned' : 'wishlist')).map(b => b.author))].sort();

            const displayedBooks = books.filter(book => {
                const matchesShelf = (book.status || 'owned') === (shelf === 'library' ? 'owned' : 'wishlist');
                const matchesAuthor = !filterAuthor || book.author === filterAuthor;
                const matchesSearch = !searchQuery || 
                    book.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    book.author.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesShelf && matchesAuthor && matchesSearch;
            });

            const booksByAuthor = {};
            displayedBooks.forEach(book => {
                if (!booksByAuthor[book.author]) {
                    booksByAuthor[book.author] = [];
                }
                booksByAuthor[book.author].push(book);
            });

            const sortedAuthors = Object.keys(booksByAuthor).sort();

            if (loading) {
                return React.createElement('div', { className: 'p-8 text-center' }, 'Loading your library...');
            }

            if (syncStatus === 'error') {
                return React.createElement('div', { className: 'p-8 text-center bg-red-50 rounded-lg m-4' },
                    React.createElement('h2', { className: 'text-red-800 font-bold mb-2' }, '⚠️ Firebase Configuration Needed'),
                    React.createElement('p', { className: 'text-red-700 mb-4' }, 'Please follow the setup instructions to add your Firebase credentials.'),
                    React.createElement('p', { className: 'text-sm text-red-600' }, 'See the comments in index.html for details.')
                );
            }

            return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6' },
                React.createElement('div', { className: 'max-w-4xl mx-auto' },
                    // Header
                    React.createElement('div', { className: 'mb-8' },
                        React.createElement('h1', { className: 'text-4xl font-bold text-gray-800 mb-2' }, '📚 Family Book Library'),
                        React.createElement('p', { className: 'text-gray-600 mb-2' }, 'Track books you own and find new ones to collect'),
                        React.createElement('p', { className: `text-xs font-medium ${syncStatus === 'synced' ? 'text-green-600' : 'text-yellow-600'}` }, 
                            `🔄 ${syncStatus === 'synced' ? 'Synced' : 'Syncing...'}`)
                    ),

                    // Add Book Section
                    React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-6 mb-6' },
                        React.createElement('h2', { className: 'text-xl font-semibold text-gray-800 mb-4' }, 'Add a Book'),
                        React.createElement('div', { className: 'flex gap-3 flex-wrap' },
                            React.createElement('div', { className: 'flex-1 min-w-48 relative' },
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Book title or author...',
                                    value: title,
                                    onChange: (e) => { setTitle(e.target.value); setShowSuggestions(true); },
                                    onKeyPress: (e) => e.key === 'Enter' && addBook(),
                                    onFocus: () => setShowSuggestions(true),
                                    className: 'w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500'
                                }),
                                showSuggestions && suggestions.length > 0 && React.createElement('div', { className: 'absolute top-full mt-1 w-full bg-white border border-gray-300 rounded-lg shadow-lg z-10 max-h-64 overflow-y-auto' },
                                    suggestions.map((suggestion, idx) =>
                                        React.createElement('button', {
                                            key: idx,
                                            onClick: () => selectSuggestion(suggestion),
                                            className: 'w-full text-left px-4 py-3 hover:bg-indigo-50 border-b border-gray-100 last:border-b-0 transition'
                                        },
                                            React.createElement('div', { className: 'font-medium text-gray-800' }, suggestion.title),
                                            React.createElement('div', { className: 'text-sm text-gray-600' }, suggestion.author)
                                        )
                                    )
                                )
                            ),
                            React.createElement('input', {
                                type: 'text',
                                placeholder: 'Author',
                                value: author,
                                onChange: (e) => setAuthor(e.target.value),
                                onKeyPress: (e) => e.key === 'Enter' && addBook(),
                                className: 'flex-1 min-w-48 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500'
                            }),
                            React.createElement('button', {
                                onClick: addBook,
                                className: 'bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition'
                            }, '➕ Add')
                        ),
                        React.createElement('div', { className: 'mt-4 pt-4 border-t border-gray-200' },
                            React.createElement('label', { className: 'flex items-center gap-2 cursor-pointer mb-4' },
                                React.createElement('input', {
                                    type: 'checkbox',
                                    checked: isWishlistItem,
                                    onChange: (e) => setIsWishlistItem(e.target.checked),
                                    className: 'w-4 h-4 rounded border-gray-300 text-yellow-500 cursor-pointer'
                                }),
                                React.createElement('span', { className: 'text-sm font-medium text-gray-700' }, '⭐ This is a wishlist item (we don\'t own it yet)')
                            ),
                            React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-3' }, 'Who has read this book?'),
                            React.createElement('div', { className: 'flex gap-4' },
                                FAMILY_MEMBERS.map(member =>
                                    React.createElement('label', { key: member, className: 'flex items-center gap-2 cursor-pointer' },
                                        React.createElement('input', {
                                            type: 'checkbox',
                                            checked: readers.includes(member),
                                            onChange: () => toggleReader(member),
                                            className: 'w-4 h-4 rounded border-gray-300 text-indigo-600 cursor-pointer'
                                        }),
                                        React.createElement('span', { className: 'text-sm text-gray-700' }, member)
                                    )
                                )
                            )
                        ),
                        React.createElement('p', { className: 'text-xs text-gray-500 mt-2' }, '💡 Tip: Start typing a book title or author name to see suggestions')
                    ),

                    // Stats and Filter
                    React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-6 mb-6' },
                        React.createElement('div', { className: 'flex flex-col gap-4' },
                            React.createElement('div', { className: 'grid grid-cols-3 gap-4 text-center' },
                                React.createElement('div', { className: 'bg-blue-50 p-3 rounded-lg' },
                                    React.createElement('div', { className: 'text-2xl font-bold text-blue-600' }, books.length),
                                    React.createElement('div', { className: 'text-sm text-gray-600' }, 'Total Books')
                                ),
                                React.createElement('div', { className: 'bg-purple-50 p-3 rounded-lg' },
                                    React.createElement('div', { className: 'text-2xl font-bold text-purple-600' }, uniqueAuthors.length),
                                    React.createElement('div', { className: 'text-sm text-gray-600' }, 'Unique Authors')
                                ),
                                React.createElement('div', { className: 'bg-green-50 p-3 rounded-lg' },
                                    React.createElement('div', { className: 'text-2xl font-bold text-green-600' }, displayedBooks.length),
                                    React.createElement('div', { className: 'text-sm text-gray-600' }, 'Displayed')
                                )
                            ),
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, '🔍 Search Books or Authors'),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Type title or author name...',
                                    value: searchQuery,
                                    onChange: (e) => setSearchQuery(e.target.value),
                                    className: 'w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500'
                                })
                            ),
                            uniqueAuthors.length > 0 && React.createElement('div', null,
                                React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-2' }, 'Filter by Author'),
                                React.createElement('select', {
                                    value: filterAuthor,
                                    onChange: (e) => setFilterAuthor(e.target.value),
                                    className: 'w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500'
                                },
                                    React.createElement('option', { value: '' }, 'All Authors'),
                                    uniqueAuthors.map(auth =>
                                        React.createElement('option', { key: auth, value: auth }, auth)
                                    )
                                )
                            )
                        )
                    ),

                    // Shelf Toggle (Library vs Wishlist)
                    React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-6 mb-6' },
                        React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-3' }, 'Shelf:'),
                        React.createElement('div', { className: 'flex gap-3' },
                            React.createElement('button', {
                                onClick: () => setShelf('library'),
                                className: `px-4 py-2 rounded-lg font-medium transition ${shelf === 'library' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`
                            }, `📚 My Library (${books.filter(b => (b.status || 'owned') === 'owned').length})`),
                            React.createElement('button', {
                                onClick: () => setShelf('wishlist'),
                                className: `px-4 py-2 rounded-lg font-medium transition ${shelf === 'wishlist' ? 'bg-yellow-500 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`
                            }, `⭐ Wishlist (${books.filter(b => b.status === 'wishlist').length})`)
                        )
                    ),

                    // View Toggle
                    React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-6 mb-6' },
                        React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-3' }, 'View Books By:'),
                        React.createElement('div', { className: 'flex gap-3' },
                            React.createElement('button', {
                                onClick: () => setViewMode('author'),
                                className: `px-4 py-2 rounded-lg font-medium transition ${viewMode === 'author' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`
                            }, '👤 Author'),
                            React.createElement('button', {
                                onClick: () => setViewMode('reader'),
                                className: `px-4 py-2 rounded-lg font-medium transition ${viewMode === 'reader' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`
                            }, '📖 Reader')
                        )
                    ),

                    // Books Display
                    displayedBooks.length === 0 ? React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-12 text-center' },
                        React.createElement('div', { className: 'text-4xl mb-4' }, '📭'),
                        React.createElement('p', { className: 'text-gray-600 text-lg' },
                            books.length === 0 ? 'No books in your library yet. Add one to get started!' : 'No books match your search or filter. Try adjusting your criteria.'
                        )
                    ) : viewMode === 'author' ? React.createElement('div', { className: 'space-y-6' },
                        sortedAuthors.map(author =>
                            React.createElement('div', { key: author, className: 'bg-white rounded-lg shadow-lg overflow-hidden' },
                                React.createElement('div', { className: 'bg-gradient-to-r from-indigo-500 to-purple-500 px-6 py-4' },
                                    React.createElement('h3', { className: 'text-xl font-bold text-white' }, author),
                                    React.createElement('p', { className: 'text-indigo-100 text-sm' }, `${booksByAuthor[author].length} book${booksByAuthor[author].length !== 1 ? 's' : ''}`)
                                ),
                                React.createElement('div', { className: 'divide-y divide-gray-200' },
                                    booksByAuthor[author].map(book =>
                                        React.createElement('div', { key: book.id, className: 'p-4 hover:bg-gray-50 transition' },
                                            React.createElement('div', { className: 'flex justify-between items-start mb-3' },
                                                React.createElement('div', { className: 'flex-1' },
                                                    React.createElement('p', { className: 'font-semibold text-gray-800' }, book.title),
                                                    React.createElement('p', { className: 'text-xs text-gray-500' }, `Added ${book.addedDate}`)
                                                ),
                                                React.createElement('div', { className: 'flex gap-2 ml-4' },
                                                    shelf === 'wishlist' && React.createElement('button', {
                                                        onClick: () => moveToLibrary(book.id),
                                                        className: 'px-3 py-1 bg-green-500 hover:bg-green-600 text-white text-xs font-medium rounded-lg transition whitespace-nowrap',
                                                        title: 'Move to Library'
                                                    }, '✅ Got it!'),
                                                    React.createElement('button', {
                                                        onClick: () => deleteBook(book.id),
                                                        className: 'p-2 text-red-500 hover:bg-red-50 rounded-lg transition',
                                                        title: 'Delete book'
                                                    }, '🗑️')
                                                )
                                            ),
                                            React.createElement('div', { className: 'mt-3 flex gap-2 flex-wrap' },
                                                FAMILY_MEMBERS.map(member =>
                                                    React.createElement('button', {
                                                        key: member,
                                                        onClick: () => {
                                                            const newReaders = book.readers?.includes(member)
                                                                ? book.readers.filter(r => r !== member)
                                                                : [...(book.readers || []), member];
                                                            updateBookReaders(book.id, newReaders);
                                                        },
                                                        className: `text-xs px-3 py-1 rounded-full font-medium transition ${book.readers?.includes(member) ? 'bg-indigo-500 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`
                                                    }, member)
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    ) : React.createElement('div', { className: 'space-y-6' },
                        FAMILY_MEMBERS.map(member => {
                            const memberBooks = displayedBooks.filter(book => book.readers?.includes(member));
                            return React.createElement('div', { key: member, className: 'bg-white rounded-lg shadow-lg overflow-hidden' },
                                React.createElement('div', { className: 'bg-gradient-to-r from-indigo-500 to-purple-500 px-6 py-4' },
                                    React.createElement('h3', { className: 'text-xl font-bold text-white' }, member),
                                    React.createElement('p', { className: 'text-indigo-100 text-sm' }, `${memberBooks.length} book${memberBooks.length !== 1 ? 's' : ''}`)
                                ),
                                memberBooks.length === 0 ? React.createElement('div', { className: 'p-6 text-center text-gray-500' },
                                    React.createElement('p', { className: 'text-sm' }, 'No books read yet')
                                ) : React.createElement('div', { className: 'divide-y divide-gray-200' },
                                    memberBooks.map(book =>
                                        React.createElement('div', { key: book.id, className: 'p-4 hover:bg-gray-50 transition' },
                                            React.createElement('div', { className: 'flex justify-between items-start mb-3' },
                                                React.createElement('div', { className: 'flex-1' },
                                                    React.createElement('p', { className: 'font-semibold text-gray-800' }, book.title),
                                                    React.createElement('p', { className: 'text-xs text-gray-600' }, `by ${book.author}`),
                                                    React.createElement('p', { className: 'text-xs text-gray-500' }, `Added ${book.addedDate}`)
                                                ),
                                                React.createElement('div', { className: 'flex gap-2 ml-4' },
                                                    shelf === 'wishlist' && React.createElement('button', {
                                                        onClick: () => moveToLibrary(book.id),
                                                        className: 'px-3 py-1 bg-green-500 hover:bg-green-600 text-white text-xs font-medium rounded-lg transition whitespace-nowrap',
                                                        title: 'Move to Library'
                                                    }, '✅ Got it!'),
                                                    React.createElement('button', {
                                                        onClick: () => deleteBook(book.id),
                                                        className: 'p-2 text-red-500 hover:bg-red-50 rounded-lg transition',
                                                        title: 'Delete book'
                                                    }, '🗑️')
                                                )
                                            ),
                                            React.createElement('div', { className: 'mt-3 flex gap-2 flex-wrap' },
                                                FAMILY_MEMBERS.map(m =>
                                                    React.createElement('button', {
                                                        key: m,
                                                        onClick: () => {
                                                            const newReaders = book.readers?.includes(m)
                                                                ? book.readers.filter(r => r !== m)
                                                                : [...(book.readers || []), m];
                                                            updateBookReaders(book.id, newReaders);
                                                        },
                                                        className: `text-xs px-3 py-1 rounded-full font-medium transition ${book.readers?.includes(m) ? 'bg-indigo-500 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`
                                                    }, m)
                                                )
                                            )
                                        )
                                    )
                                )
                            );
                        })
                    )
                )
            );
        }

        ReactDOM.render(React.createElement(BookTracker), document.getElementById('root'));
    </script>
</body>
</html>
